<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stackly — Sign Up</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<style>
/* =========================================================
   STACKLY — NGO / NONPROFIT SIGN UP
   Internal CSS (theme matched to reference screenshots)
   ========================================================= */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root{
  --teal:        #1aa189;
  --teal-dark:   #0e8b76;
  --teal-light:  #2fd0b0;
  --panel:       #3f5f54;
  --white:       #ffffff;
}

html{
  background: var(--panel);
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body{
  font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh;
  color: #fff;
  overflow-x: hidden;

  /* ---------- BACKGROUND IMAGE + TEAL FILTER ---------- */
  background-image:
    linear-gradient(100deg,
        rgba(63,95,84,1)    0%,
        rgba(63,95,84,1)    38%,
        rgba(63,95,84,.88)  50%,
        rgba(63,95,84,.45)  66%,
        rgba(63,95,84,.12)  82%,
        rgba(63,95,84,.05) 100%),
    url("./images/background.webp");
  background-size: 100% 100%, cover;
  background-position: center, center right;
  background-repeat: no-repeat, no-repeat;
}

/* =========================================================
   LAYOUT
   ========================================================= */
.page{
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding: 48px 7vw;
}

.form-side{
  width: 100%;
  max-width: 510px;
}

/* ---------- BACK TO HOME ---------- */
.back-home{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 22px;
  padding: 9px 18px;
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 6px;
  background: rgba(255,255,255,.10);
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  transition: background .2s ease, transform .2s ease, border-color .2s ease;
}
.back-home:hover{
  background: rgba(255,255,255,.20);
  border-color: #fff;
  transform: translateY(-2px);
}

/* ---------- HEADINGS ---------- */
.title{
  font-size: clamp(30px, 4vw, 48px);
  font-weight: 800;
  letter-spacing: -.5px;
  line-height: 1.08;
  margin-bottom: 14px;
}

.subtitle{
  font-size: clamp(11.5px, 1.05vw, 15px);
  letter-spacing: 4px;
  text-transform: uppercase;
  font-weight: 400;
  opacity: .95;
  margin-bottom: 42px;
}

/* ---------- FIELDS ---------- */
.field{ margin-bottom: 22px; }

.field label{
  display: block;
  font-size: 14px;
  font-weight: 400;
  color: #eef4f1;
  margin-bottom: 10px;
}

.field input{
  width: 100%;
  height: 48px;
  border: none;
  outline: none;
  border-radius: 6px;
  padding: 0 16px;
  font-size: 14px;
  font-family: inherit;
  color: #2c3e37;
  background: #fff;
  transition: box-shadow .2s ease;
}
.field input::placeholder{ color: #b6bfbb; }
.field input:focus{ box-shadow: 0 0 0 3px rgba(26,161,137,.45); }

/* =========================================================
   PASSWORD FIELD + EYE ICON  (Edge / IE / Safari safe)
   ========================================================= */

/* 1) Kill the browser's built-in reveal & clear buttons */
.field input[type="password"]::-ms-reveal,
.field input[type="password"]::-ms-clear,
.field input[type="password"]::-webkit-credentials-auto-fill-button,
.field input[type="password"]::-webkit-textfield-decoration-container{
  display: none !important;
  visibility: hidden !important;
  width: 0 !important;
  height: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  pointer-events: none !important;
  -webkit-appearance: none;
  appearance: none;
}

/* 2) Wrapper */
.pwd-wrap{
  position: relative;
  display: block;
  width: 100%;
}

/* 3) Reserve room on the right so text can NEVER slide under the icon */
.pwd-wrap input{
  width: 100%;
  padding-right: 52px !important;   /* icon width + both gaps */
  text-overflow: ellipsis;
}

/* 4) The custom eye — centred without transform hacks */
.pwd-wrap .toggle-eye{
  position: absolute;
  top: 0;
  bottom: 0;
  right: 14px;
  margin: auto 0;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  line-height: 1;
  color: #9aa8a2;
  cursor: pointer;
  z-index: 2;
  background: transparent;
  border: 0;
  -webkit-user-select: none;
  user-select: none;
  transition: color .2s ease;
}
.pwd-wrap .toggle-eye:hover,
.pwd-wrap .toggle-eye:focus-visible{ color: var(--teal); }

/* ---------- PASSWORD STRENGTH ---------- */
.strength{
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.strength-bar{
  flex: 1;
  height: 4px;
  border-radius: 99px;
  background: rgba(255,255,255,.28);
  transition: background .25s ease;
}
.strength-bar.active.weak  { background: #e74c3c; }
.strength-bar.active.medium{ background: #f1c40f; }
.strength-bar.active.strong{ background: #2ecc71; }

/* ---------- ROLE BOXES ---------- */
.role-boxes{
  display: flex;
  gap: 22px;
}
.role-box{
  flex: 1;
  height: 48px;
  border: 2px solid transparent;
  border-radius: 6px;
  background: #fff;
  color: #a9b3af;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  transition: all .2s ease;
}
.role-box:hover{ color: #7d8985; }
.role-box.active{
  border-color: var(--teal);
  color: var(--teal);
  font-weight: 600;
  box-shadow: 0 0 0 3px rgba(26,161,137,.18);
}

/* ---------- PRIMARY BUTTON ---------- */
.actions{
  display: flex;
  justify-content: center;
  margin-top: 30px;
}
.btn-primary{
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 152px;
  height: 48px;
  padding: 0 42px;
  border: none;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 10px 22px rgba(0,0,0,.22);
  transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
}
.btn-primary:hover{
  transform: translateY(-2px);
  box-shadow: 0 14px 26px rgba(0,0,0,.30);
}
.btn-primary:active{ transform: translateY(0); }
.btn-primary.loading{ pointer-events: none; filter: brightness(.95); }

.btn-primary .spinner{
  display: none;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
.btn-primary.loading .btn-text{ display: none; }
.btn-primary.loading .spinner { display: block; }
@keyframes spin{ to{ transform: rotate(360deg); } }

/* ---------- OR DIVIDER ---------- */
.divider{
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 26px 0 20px;
}
.divider::before,
.divider::after{
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,.45);
}
.divider span{
  font-size: 12px;
  letter-spacing: 1.5px;
  color: #fff;
}

/* ---------- SOCIAL BUTTONS ---------- */
.socials{
  display: flex;
  justify-content: center;
  gap: 16px;
}
.social-btn{
  width: 62px;
  height: 48px;
  border: none;
  border-radius: 8px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(0,0,0,.16);
  transition: transform .2s ease, box-shadow .2s ease;
}
.social-btn:hover{
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(0,0,0,.22);
}
.social-btn .fa-google    { color: #ea4335; }
.social-btn .fa-facebook-f{ color: #1877f2; }
.social-btn .fa-apple     { color: #111111; }

/* ---------- BOTTOM SWITCH LINE ---------- */
.switch-line{
  text-align: center;
  margin-top: 24px;
  font-size: 13px;
  color: #eef4f1;
}
.switch-line a{
  color: #fff;
  font-weight: 700;
  text-decoration: underline;
}

/* =========================================================
   TOAST
   ========================================================= */
.toast{
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 10000;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  max-width: 350px;
  padding: 14px 18px;
  border-radius: 10px;
  border-left: 4px solid var(--teal);
  background: #fff;
  color: #20302b;
  box-shadow: 0 12px 32px rgba(0,0,0,.25);
  opacity: 0;
  transform: translateY(-24px);
  pointer-events: none;
  transition: opacity .35s cubic-bezier(.4,0,.2,1),
              transform .35s cubic-bezier(.4,0,.2,1);
}
.toast.show{ opacity: 1; transform: translateY(0); }
.toast.error{ border-left-color: #e74c3c; }
.toast.info { border-left-color: #3498db; }

.toast-icon{ font-size: 18px; line-height: 1.2; }
.toast-title{
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 3px;
}
.toast-msg{
  font-size: 12.5px;
  line-height: 1.45;
  color: #5b6b65;
}

/* =========================================================
   PRELOADER  —  Stackly Nonprofit (home page style)
   ========================================================= */
body.preloader-active {
  overflow: hidden;
}

.preloader {
  position: fixed;
  inset: 0;
  z-index: 3000;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 42%, rgba(232, 183, 48, 0.15) 0%, rgba(232, 183, 48, 0) 58%),
    linear-gradient(160deg, #0e4a2d 0%, #094C3B 52%, #072a1b 100%);
  opacity: 1;
  visibility: visible;
  transition: opacity 0.45s ease, visibility 0.45s ease;
}

.preloader--done {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.preloader__inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 0 24px;
  animation: preFadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
}

@keyframes preFadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.preloader__mark {
  position: relative;
  width: 116px;
  height: 116px;
  margin-bottom: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.preloader__mark::before {
  content: '';
  position: absolute;
  inset: -18px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232, 183, 48, 0.24) 0%, rgba(232, 183, 48, 0) 70%);
  animation: prePulse 2.2s ease-in-out infinite;
}

@keyframes prePulse {
  0%, 100% { transform: scale(0.9);  opacity: 0.55; }
  50%      { transform: scale(1.08); opacity: 1; }
}

.preloader__ring {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.preloader__ring-track {
  fill: none;
  stroke: rgba(255, 255, 255, 0.13);
  stroke-width: 4;
}

.preloader__ring-progress {
  fill: none;
  stroke: #e8b730;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 100;
  stroke-dashoffset: 100;
  transition: stroke-dashoffset 0.18s linear;
  filter: drop-shadow(0 0 6px rgba(232, 183, 48, 0.55));
}

.preloader__heart {
  position: relative;
  width: 44px;
  height: 44px;
  animation: preBeat 1.6s ease-in-out infinite;
}

.preloader__heart-path {
  fill: rgba(255, 255, 255, 0.08);
  stroke: #ffffff;
  stroke-width: 3;
  stroke-linejoin: round;
  stroke-linecap: round;
  stroke-dasharray: 100;
  stroke-dashoffset: 100;
  animation: preDraw 1.5s ease-out 0.15s forwards;
}

@keyframes preDraw {
  to { stroke-dashoffset: 0; }
}

@keyframes preBeat {
  0%, 100% { transform: scale(1); }
  14%      { transform: scale(1.13); }
  28%      { transform: scale(1); }
  42%      { transform: scale(1.08); }
  56%      { transform: scale(1); }
}

.preloader__brand {
  font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
  font-size: 1.85rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #ffffff;
  line-height: 1;
  margin-bottom: 10px;
}

.preloader__tagline {
  font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 0.82rem;
  font-weight: 400;
  letter-spacing: 0.4px;
  color: rgba(255, 255, 255, 0.62);
  max-width: 300px;
  line-height: 1.55;
  margin-bottom: 30px;
}

.preloader__progress {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(240px, 72vw);
}

.preloader__bar {
  position: relative;
  flex: 1;
  height: 4px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.14);
  overflow: hidden;
}

.preloader__bar-fill {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 99px;
  background: linear-gradient(90deg, #e8b730, #f5d76e);
  transition: width 0.18s linear;
  box-shadow: 0 0 10px rgba(232, 183, 48, 0.5);
}

.preloader__pct {
  font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.78);
  min-width: 36px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

@media (max-width: 480px) {
  .preloader__mark { width: 96px; height: 96px; margin-bottom: 22px; }
  .preloader__heart { width: 36px; height: 36px; }
  .preloader__brand { font-size: 1.55rem; }
  .preloader__tagline { font-size: 0.76rem; margin-bottom: 24px; }
  .preloader__progress { width: min(210px, 74vw); }
}

@media (prefers-reduced-motion: reduce) {
  .preloader__inner,
  .preloader__mark::before,
  .preloader__heart,
  .preloader__heart-path {
    animation: none !important;
  }
  .preloader__heart-path { stroke-dashoffset: 0; }
  .preloader__ring-progress,
  .preloader__bar-fill { transition: none; }
}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 900px){
  .page{ padding: 44px 6vw; }
  body{
    background-image:
      linear-gradient(160deg,
          rgba(63,95,84,.97)  0%,
          rgba(63,95,84,.95) 55%,
          rgba(63,95,84,.90) 100%),
      url("hands-jar.jpg");
  }
}

@media (max-width: 520px){
  .page{
    padding: 34px 20px 44px;
    align-items: flex-start;
  }
  .title{ font-size: 30px; }
  .subtitle{
    font-size: 11.5px;
    letter-spacing: 3px;
    margin-bottom: 30px;
  }
  .field{ margin-bottom: 18px; }
  .field input{ height: 46px; font-size: 13.5px; }
  .role-boxes{ gap: 14px; }
  .role-box{ height: 46px; font-size: 13.5px; }
  .actions{ margin-top: 26px; }
  .btn-primary{ min-width: 160px; height: 48px; }
  .socials{ gap: 12px; }
  .social-btn{ flex: 1; width: auto; height: 46px; }
  .switch-line{ font-size: 12.5px; }
  .toast{
    top: 14px;
    left: 14px;
    right: 14px;
    max-width: none;
  }
}
</style>
</head>

<body>

<!-- ================================================================
     PRELOADER  —  Stackly Nonprofit
     ================================================================ -->
<div class="preloader" id="preloader" role="status" aria-live="polite" aria-label="Loading Stackly Nonprofit">
  <div class="preloader__inner">

    <div class="preloader__mark">
      <svg class="preloader__ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="preloader__ring-track" cx="60" cy="60" r="52"></circle>
        <circle class="preloader__ring-progress" id="preRing"
                cx="60" cy="60" r="52" pathLength="100"></circle>
      </svg>

      <svg class="preloader__heart" viewBox="0 0 64 64" aria-hidden="true">
        <path class="preloader__heart-path" pathLength="100"
              d="M32 56.5C13.4 42 5 32.2 5 22.7 5 13.9 11.7 7 20.2 7c5.1 0 9.3 2.7 11.8 7.3C34.5 9.7 38.7 7 43.8 7 52.3 7 59 13.9 59 22.7c0 9.5-8.4 19.3-27 33.8z"></path>
      </svg>
    </div>

    <div class="preloader__brand">Stackly</div>
    <p class="preloader__tagline">Every Helping Hand, Every Heartfelt Change</p>

    <div class="preloader__progress">
      <div class="preloader__bar">
        <span class="preloader__bar-fill" id="preBarFill"></span>
      </div>
      <span class="preloader__pct"><span id="prePct">0</span>%</span>
    </div>

  </div>
</div>

<!-- ============ PAGE ============ -->
<main class="page">
  <section class="form-side">

    <a href="index.html" class="back-home">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>

    <h1 class="title">Welcome Back</h1>
    <p class="subtitle">Register with email</p>

    <form id="signupForm" class="form" novalidate>

      <!-- NAME -->
      <div class="field">
        <label for="signupName">Name</label>
        <input type="text" id="signupName" placeholder="John Doe"
               autocomplete="name" spellcheck="false" />
      </div>

      <!-- EMAIL -->
      <div class="field">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="you@gmail.com"
               autocomplete="email" spellcheck="false" />
      </div>

      <!-- PASSWORD -->
      <div class="field">
        <label for="signupPassword">Password</label>
        <div class="pwd-wrap">
          <input type="password" id="signupPassword" placeholder=""
                 autocomplete="new-password" />
          <i class="fa-solid fa-eye toggle-eye"
             onclick="togglePassword('signupPassword', this)"
             aria-label="Show password"></i>
        </div>
        <div class="strength" id="signupPwdStrength">
          <span class="strength-bar"></span>
          <span class="strength-bar"></span>
          <span class="strength-bar"></span>
          <span class="strength-bar"></span>
        </div>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div class="field">
        <label for="signupConfirm">Confirm Password</label>
        <div class="pwd-wrap">
          <input type="password" id="signupConfirm" placeholder=""
                 autocomplete="new-password" />
          <i class="fa-solid fa-eye toggle-eye"
             onclick="togglePassword('signupConfirm', this)"
             aria-label="Show password"></i>
        </div>
      </div>

      <!-- ROLE -->
      <div class="field">
        <label>Select Role</label>
        <div class="role-boxes">
          <button type="button" class="role-box active" data-role="customer">User</button>
          <button type="button" class="role-box" data-role="employee">Admin</button>
        </div>
      </div>

      <!-- REGISTER BUTTON -->
      <div class="actions">
        <button type="submit" class="btn-primary" id="registerBtn">
          <span class="btn-text">Register</span>
          <span class="spinner"></span>
        </button>
      </div>

      <!-- OR -->
      <div class="divider"><span>OR</span></div>

      <!-- SOCIALS -->
      <div class="socials">
        <button type="button" class="social-btn" data-provider="Google" aria-label="Sign up with Google">
          <i class="fa-brands fa-google"></i>
        </button>
        <button type="button" class="social-btn" data-provider="Facebook" aria-label="Sign up with Facebook">
          <i class="fa-brands fa-facebook-f"></i>
        </button>
        <button type="button" class="social-btn" data-provider="Apple" aria-label="Sign up with Apple">
          <i class="fa-brands fa-apple"></i>
        </button>
      </div>

      <p class="switch-line">
        Already have account? <a href="login.html">Sign In</a>
      </p>

    </form>
  </section>
</main>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="toast-icon" id="toastIconEl">✅</div>
  <div class="toast-body">
    <div class="toast-title" id="toastTitle">Title</div>
    <div class="toast-msg" id="toastMsg">Message</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =====================================================
     STATE
     ===================================================== */
  let currentRole = 'customer';

  const toastEl     = document.getElementById('toast');
  const toastIconEl = document.getElementById('toastIconEl');
  const toastTitle  = document.getElementById('toastTitle');
  const toastMsg    = document.getElementById('toastMsg');
  let toastTimer;

  /* =====================================================
     UTILITIES
     ===================================================== */
  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
  }

  function isGmailEmail(email) {
    return email.trim().toLowerCase().endsWith('@gmail.com');
  }

  function isStrongPassword(pwd) {
    if (!pwd || pwd.length < 8) return false;
    const hasLetter  = /[A-Za-z]/.test(pwd);
    const hasDigit   = /[0-9]/.test(pwd);
    const hasSpecial = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~`]/.test(pwd);
    return hasLetter && hasDigit && hasSpecial;
  }

  function sanitizeName(input) {
    input.value = input.value.replace(/[^A-Za-z\s]/g, '');
  }

  /* =====================================================
     TOAST NOTIFICATIONS
     ===================================================== */
  function showToast(type, title, msg) {
    clearTimeout(toastTimer);
    toastEl.className = 'toast ' + type;
    toastIconEl.textContent = type === 'success' ? '✅'
                            : type === 'error'   ? '❌'
                            : 'ℹ️';
    toastTitle.textContent = title;
    toastMsg.textContent   = msg;

    requestAnimationFrame(function () {
      toastEl.classList.add('show');
    });

    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 3200);
  }
  window.showToast = showToast;

  /* =====================================================
     PASSWORD TOGGLE
     ===================================================== */
  function togglePassword(inputId, iconEl) {
    const input = document.getElementById(inputId);
    if (!input) return;

    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';

    iconEl.classList.toggle('fa-eye', !isPassword);
    iconEl.classList.toggle('fa-eye-slash', isPassword);
    iconEl.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
  }
  window.togglePassword = togglePassword;

  /* =====================================================
     PASSWORD STRENGTH METER
     ===================================================== */
  function updatePasswordStrength(inputId, strengthId) {
    const input = document.getElementById(inputId);
    const strengthEl = document.getElementById(strengthId);
    if (!input || !strengthEl) return;

    input.addEventListener('input', function () {
      const pwd = this.value;
      const bars = strengthEl.querySelectorAll('.strength-bar');
      let score = 0;
      if (pwd.length >= 4) score++;
      if (pwd.length >= 8) score++;
      if (/[A-Za-z]/.test(pwd) && /[0-9]/.test(pwd)) score++;
      if (/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~`]/.test(pwd)) score++;

      const classes = ['', 'weak', 'weak', 'medium', 'strong'];
      bars.forEach(function (bar, i) {
        bar.classList.remove('active', 'weak', 'medium', 'strong');
        if (i < score) {
          bar.classList.add('active', classes[score]);
        }
      });
    });
  }

  /* =====================================================
     INPUT FILTERS
     ===================================================== */
  function filterNameKeypress(e) {
    const char = String.fromCharCode(e.which || e.keyCode);
    if (!/[A-Za-z\s]/.test(char)) e.preventDefault();
  }

  function setupInputFilters() {
    const nameInput = document.getElementById('signupName');
    if (nameInput) {
      nameInput.addEventListener('keypress', filterNameKeypress);
      nameInput.addEventListener('input', function () { sanitizeName(this); });
    }
  }

  /* =====================================================
     LOADING SIMULATION
     ===================================================== */
  function simulateLoading(btnId, duration) {
    duration = duration || 1200;
    const btn = document.getElementById(btnId);
    if (!btn) return Promise.resolve();

    btn.classList.add('loading');
    return new Promise(function (resolve) {
      setTimeout(function () {
        btn.classList.remove('loading');
        resolve();
      }, duration);
    });
  }

  /* =====================================================
     SIGNUP HANDLER
     ===================================================== */
  function handleSignup(event) {
    event.preventDefault();

    const nameInput    = document.getElementById('signupName');
    const emailInput   = document.getElementById('signupEmail');
    const pwdInput     = document.getElementById('signupPassword');
    const confirmInput = document.getElementById('signupConfirm');

    const name     = nameInput.value.trim();
    const email    = emailInput.value.trim();
    const password = pwdInput.value;
    const confirm  = confirmInput.value;

    /* ---- name ---- */
    if (!/^[A-Za-z\s]{2,}$/.test(name)) {
      showToast('error', 'Invalid Name',
        'Name must contain only alphabets and spaces (min 2 chars).');
      nameInput.focus();
      return;
    }

    /* ---- email ---- */
    if (!email || !isValidEmail(email)) {
      showToast('error', 'Invalid Email', 'Please enter a valid email address.');
      emailInput.focus();
      return;
    }
    if (!isGmailEmail(email)) {
      showToast('error', 'Email Restriction', 'Email must end with @gmail.com.');
      emailInput.focus();
      return;
    }

    /* ---- password ---- */
    if (!isStrongPassword(password)) {
      showToast('error', 'Weak Password',
        'Password must be 8+ chars with letters, numbers & special characters.');
      pwdInput.focus();
      return;
    }

    /* ---- confirm ---- */
    if (password !== confirm) {
      showToast('error', 'Password Mismatch', 'Passwords do not match.');
      confirmInput.focus();
      return;
    }

    /* ---- submit ---- */
    simulateLoading('registerBtn', 1400).then(function () {

      const userName = name.split(' ')[0] || 'User';

      localStorage.setItem('loggedInUserEmail', email);
      localStorage.setItem('loggedInUserName',  userName);
      localStorage.setItem('userRole',         currentRole);
      localStorage.setItem('loginMethod',      'email');

      if (currentRole === 'employee') {
        localStorage.setItem('loggedInDept',     'Admin');
        localStorage.setItem('stacklyUserEmail', email);
        localStorage.setItem('stacklyUserName',  userName);
        localStorage.setItem('stacklyStaffRole', 'Admin');
      } else {
        localStorage.setItem('loggedInDept', '');
      }

      localStorage.setItem('loginTimestamp', new Date().toISOString());

      showToast('success',
        currentRole === 'employee' ? 'Registration Submitted' : 'Account Created!',
        currentRole === 'employee'
          ? 'Thank you, ' + userName + '! Pending admin approval.'
          : 'Welcome, ' + userName + '! Please sign in.'
      );

      /* reset form */
      nameInput.value    = '';
      emailInput.value   = '';
      pwdInput.value     = '';
      confirmInput.value = '';
      pwdInput.type      = 'password';
      confirmInput.type  = 'password';

      /* redirect to login page after a short delay */
      setTimeout(function () {
        window.location.href = 'login.html';
      }, 1800);
    });
  }

  /* =====================================================
     PRELOADER  —  Stackly Nonprofit (home page style)
     ===================================================== */
  function initPreloader() {
    var preloader = document.getElementById('preloader');
    if (!preloader) return;

    var ring    = document.getElementById('preRing');
    var barFill = document.getElementById('preBarFill');
    var pctEl   = document.getElementById('prePct');

    var HOLD_MAX  = 1500;   /* max ms of the "loading" ramp   */
    var FILL_TIME = 500;    /* ms for the final sweep to 100% */
    var FADE_TIME = 450;    /* ms for the overlay to fade out */
    var CEILING   = 92;     /* progress cap while ramping     */

    var currentPct  = 0;
    var startTime   = Date.now();
    var isReady     = false;
    var isFinishing = false;
    var isHidden    = false;

    document.body.classList.add('preloader-active');

    function setProgress(p) {
      p = Math.max(0, Math.min(100, p));
      currentPct = p;

      if (ring)    ring.style.strokeDashoffset = String(100 - p);
      if (barFill) barFill.style.width = p + '%';
      if (pctEl)   pctEl.textContent = Math.round(p);
    }

    setProgress(0);

    function hidePreloader() {
      if (isHidden) return;
      isHidden = true;

      preloader.classList.add('preloader--done');
      document.body.classList.remove('preloader-active');

      window.setTimeout(function () {
        if (preloader && preloader.parentNode) {
          preloader.parentNode.removeChild(preloader);
        }
      }, FADE_TIME + 80);
    }

    function finish() {
      if (isFinishing || isHidden) return;
      isFinishing = true;

      var from = currentPct;
      var t0 = Date.now();

      function step() {
        var t = Math.min((Date.now() - t0) / FILL_TIME, 1);
        var eased = 1 - Math.pow(1 - t, 2);
        setProgress(from + (100 - from) * eased);

        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          setProgress(100);
          window.setTimeout(hidePreloader, 130);
        }
      }

      requestAnimationFrame(step);
    }

    function ramp() {
      if (isHidden || isFinishing) return;

      if (isReady) { finish(); return; }

      var elapsed = Date.now() - startTime;
      var t = Math.min(elapsed / HOLD_MAX, 1);
      var eased = 1 - Math.pow(1 - t, 2.4);

      setProgress(eased * CEILING);

      if (elapsed >= HOLD_MAX) { finish(); return; }

      requestAnimationFrame(ramp);
    }

    function markReady() {
      if (isReady || isFinishing || isHidden) return;
      isReady = true;

      /* Small courtesy pause so a fast load doesn't flash */
      var elapsed = Date.now() - startTime;
      var wait = Math.max(0, 650 - elapsed);
      window.setTimeout(finish, wait);
    }

    if (document.readyState === 'complete') {
      markReady();
    } else {
      window.addEventListener('load', markReady);
      /* Safety net — never let the preloader hang */
      window.setTimeout(markReady, HOLD_MAX + 150);
    }

    requestAnimationFrame(ramp);
  }

  /* =====================================================
     DOM READY
     ===================================================== */
  document.addEventListener('DOMContentLoaded', function () {

    initPreloader();
    setupInputFilters();
    updatePasswordStrength('signupPassword', 'signupPwdStrength');

    /* ---- role boxes ---- */
    document.querySelectorAll('.role-box').forEach(function (box) {
      box.addEventListener('click', function () {
        document.querySelectorAll('.role-box').forEach(function (b) {
          b.classList.remove('active');
        });
        box.classList.add('active');
        currentRole = box.dataset.role;
      });
    });

    /* ---- submit ---- */
    document.getElementById('signupForm')
      .addEventListener('submit', handleSignup);

    /* ---- social buttons ---- */
    document.querySelectorAll('.social-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        window.location.href = '404.html';
      });
    });
  });

  /* =====================================================
     KEYBOARD SHORTCUTS
     ===================================================== */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && e.key === '1') {
      e.preventDefault();
      document.querySelector('.role-box[data-role="customer"]').click();
    }
    if (e.ctrlKey && e.key === '2') {
      e.preventDefault();
      document.querySelector('.role-box[data-role="employee"]').click();
    }
  });

})();
</script>
